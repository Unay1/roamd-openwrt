name: Test roamd build and APK signing

on:
  push:
    branches:
      - feature/self-hosted-feed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: OpenWrt 25.12.6 / filogic + x86-64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: |
          sh -n build.sh repo.sh install.sh scripts/generate-apk-key.sh scripts/sign-apks.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Build packages with the official SDKs
        env:
          RELEASE: 25.12.6
          JOBS: 2
        run: |
          sh ./build.sh aarch64_cortex-a53
          sh ./build.sh x86_64

      - name: Prepare APK signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || {
            echo "::error::Repository secret APK_SIGN_KEY is missing."
            exit 1
          }
          mkdir -p /tmp/roamd-keys
          printf '%s\n' "$APK_SIGN_KEY" > /tmp/roamd-keys/roamd.pem
          chmod 600 /tmp/roamd-keys/roamd.pem

      - name: Verify APK signing key matches the published public key
        run: |
          openssl pkey -in /tmp/roamd-keys/roamd.pem -pubout -out /tmp/roamd-keys/roamd.pub
          cmp -s /tmp/roamd-keys/roamd.pub keys/roamd-apk.rsa.pub || {
            echo "::error::APK_SIGN_KEY does not match keys/roamd-apk.rsa.pub"
            exit 1
          }

      - name: Sign and verify individual APK packages
        run: |
          sh ./scripts/sign-apks.sh build/sdk-25.12.6-mediatek-filogic dist/25.12/aarch64_cortex-a53 /tmp/roamd-keys/roamd.pem keys
          sh ./scripts/sign-apks.sh build/sdk-25.12.6-x86-64 dist/25.12/x86_64 /tmp/roamd-keys/roamd.pem keys

      - name: Build signed APK repository indexes
        run: |
          sh ./repo.sh index-feed 25.12 aarch64_cortex-a53 /tmp/roamd-keys
          sh ./repo.sh index-feed 25.12 x86_64 /tmp/roamd-keys
          test -s dist/25.12/aarch64_cortex-a53/packages.adb
          test -s dist/25.12/x86_64/packages.adb
          file dist/25.12/aarch64_cortex-a53/packages.adb dist/25.12/x86_64/packages.adb

      - name: Upload test packages (no release publishing)
        uses: actions/upload-artifact@v4
        with:
          name: roamd-openwrt-25.12.6-multiarch-test
          path: |
            dist/25.12/aarch64_cortex-a53/
            dist/25.12/x86_64/
          if-no-files-found: error
          retention-days: 7
