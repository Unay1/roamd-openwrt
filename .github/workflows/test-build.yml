name: Test roamd build and APK signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: OpenWrt 25.12.6 / mediatek-filogic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Checkout roamd source
        uses: actions/checkout@v7
        with:
          ref: import/upstream-roamd
          path: source

      - name: Validate shell syntax
        run: |
          cd source
          for script in build.sh repo.sh install.sh scripts/generate-apk-key.sh; do
            sh -n "$script"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Build packages with the official SDK
        env:
          RELEASE: 25.12.6
          JOBS: 2
        run: |
          cd source
          sh ./build.sh aarch64_cortex-a53

      - name: Prepare APK signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || {
            echo "::error::Repository secret APK_SIGN_KEY is missing."
            exit 1
          }
          mkdir -p /tmp/roamd-keys
          printf '%s\\n' "$APK_SIGN_KEY" > /tmp/roamd-keys/roamd.pem
          chmod 600 /tmp/roamd-keys/roamd.pem

      - name: Verify APK signing key matches the published public key
        run: |
          openssl pkey -in /tmp/roamd-keys/roamd.pem -pubout -out /tmp/roamd-keys/roamd.pub
          cmp -s /tmp/roamd-keys/roamd.pub source/keys/roamd-apk.pem || {
            echo "::error::APK_SIGN_KEY does not match keys/roamd-apk.pem"
            exit 1
          }

      - name: Build signed APK repository index
        run: |
          cd source
          sh ./repo.sh index-feed 25.12 aarch64_cortex-a53 /tmp/roamd-keys
          test -s dist/25.12/aarch64_cortex-a53/packages.adb
          file dist/25.12/aarch64_cortex-a53/packages.adb

      - name: Upload test packages (no release publishing)
        uses: actions/upload-artifact@v4
        with:
          name: roamd-openwrt-25.12.6-aarch64_cortex-a53-test
          path: source/dist/25.12/aarch64_cortex-a53/
          if-no-files-found: error
          retention-days: 7
