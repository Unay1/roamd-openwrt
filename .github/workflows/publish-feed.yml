name: Publish roamd package feed

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: OpenWrt package architecture
        required: true
        default: aarch64_cortex-a53
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: OpenWrt 25.12.6 / ${{ inputs.architecture }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate scripts
        run: |
          sh -n build.sh repo.sh install.sh scripts/generate-apk-key.sh scripts/sign-apks.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Build packages with the official SDK
        env:
          RELEASE: 25.12.6
          JOBS: 2
        run: |
          sh ./build.sh "${{ inputs.architecture }}"

      - name: Prepare APK signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || {
            echo "::error::Repository secret APK_SIGN_KEY is missing."
            exit 1
          }
          mkdir -p /tmp/roamd-keys
          printf '%s\n' "$APK_SIGN_KEY" > /tmp/roamd-keys/roamd.pem
          chmod 600 /tmp/roamd-keys/roamd.pem

      - name: Verify signing key matches published public key
        run: |
          openssl pkey -in /tmp/roamd-keys/roamd.pem -pubout -out /tmp/roamd-keys/roamd.pub
          cmp -s /tmp/roamd-keys/roamd.pub keys/roamd-apk.rsa.pub || {
            echo "::error::APK_SIGN_KEY does not match keys/roamd-apk.rsa.pub"
            exit 1
          }

      - name: Sign and verify individual APK packages
        env:
          ARCH: ${{ inputs.architecture }}
        run: |
          target=$(awk -v arch="$ARCH" '$1 == arch { print $2 }' targets/25.12.txt)
          [ -n "$target" ] || {
            echo "::error::Unknown OpenWrt package architecture: $ARCH"
            exit 1
          }
          sdk_dir="build/sdk-25.12.6-$(printf '%s' "$target" | tr / -)"
          sh ./scripts/sign-apks.sh "$sdk_dir" "dist/25.12/$ARCH" /tmp/roamd-keys/roamd.pem keys

      - name: Build signed APK feed
        env:
          ARCH: ${{ inputs.architecture }}
        run: |
          sh ./repo.sh index-feed 25.12 "$ARCH" /tmp/roamd-keys
          feed="dist/feed-25.12-$ARCH"
          mkdir -p "$feed"
          cp dist/25.12/"$ARCH"/*.apk "$feed/"
          cp dist/25.12/"$ARCH"/packages.adb "$feed/"
          test "$(find "$feed" -maxdepth 1 -name '*.apk' | wc -l)" -eq 3
          test -s "$feed/packages.adb"
          ls -lh "$feed"

      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^PKG_VERSION:=//p' package/roamd/Makefile | head -n 1)
          [ -n "$version" ] || {
            echo "::error::Unable to determine roamd package version."
            exit 1
          }
          sh ./repo.sh publish dist "$version"
